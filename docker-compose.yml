name: nacional
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nacional}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup para criar o .env}
      POSTGRES_DB: ${POSTGRES_DB:-nacional}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    user: "${API_UID:-1000}:${API_GID:-1000}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NPM_CONFIG_CACHE: /tmp/nacional-npm-cache
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Esporte}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      HOST: 0.0.0.0
      TRUST_PROXY: ${DOCKER_NETWORK_GATEWAY:-172.30.77.1}
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-nacional}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nacional}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      CARD_TOKEN_SECRET: ${CARD_TOKEN_SECRET:?Execute o setup para gerar CARD_TOKEN_SECRET no .env}
      JWT_SECRET: ${JWT_SECRET:?Execute npm run setup para gerar o segredo JWT}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:?Execute npm run setup para gerar o segredo dos ingressos}
      JWT_ISSUER: nacional-api
      JWT_AUDIENCE: nacional-app
      JWT_ACCESS_TTL_SECONDS: 900
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      MELHOR_ENVIO_ENVIRONMENT: ${MELHOR_ENVIO_ENVIRONMENT:-sandbox}
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN:-}
      MELHOR_ENVIO_CONTACT_EMAIL: ${MELHOR_ENVIO_CONTACT_EMAIL:-}
      MELHOR_ENVIO_SERVICES: ${MELHOR_ENVIO_SERVICES-1,2}
      SICREDI_PIX_ENV: ${SICREDI_PIX_ENV:-production}
      SICREDI_PIX_API_URL: ${SICREDI_PIX_API_URL:-}
      SICREDI_PIX_AUTH_URL: ${SICREDI_PIX_AUTH_URL:-}
      SICREDI_PIX_CLIENT_ID: ${SICREDI_PIX_CLIENT_ID:-}
      SICREDI_PIX_CLIENT_SECRET: ${SICREDI_PIX_CLIENT_SECRET:-}
      SICREDI_PIX_RECEIVING_KEY: ${SICREDI_PIX_RECEIVING_KEY:-}
      SICREDI_PIX_CERT_PASSPHRASE: ${SICREDI_PIX_CERT_PASSPHRASE:-}
      SICREDI_PIX_WEBHOOK_TOKEN: ${SICREDI_PIX_WEBHOOK_TOKEN:-}
      SICREDI_PIX_WEBHOOK_URL: ${SICREDI_PIX_WEBHOOK_URL:-}
      SICREDI_PIX_CERT_PATH: /run/sicredi/sicredi-multipag.cer
      SICREDI_PIX_KEY_PATH: /run/sicredi/sicredi-multipag.key
      SICREDI_PIX_CHAIN_PATH: /run/sicredi/sicredi-multipag-chain.cer
      SICREDI_PIX_TXID_PREFIX: ${SICREDI_PIX_TXID_PREFIX:-ESP}
      SICREDI_PIX_TIMEOUT_MS: ${SICREDI_PIX_TIMEOUT_MS:-10000}
      TENANT_SLUG: ${TENANT_SLUG:-nacional-patos}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sócio Esporte}
      MAIL_DATA_SECRET: ${MAIL_DATA_SECRET:-}
      PASSWORD_RESET_PUBLIC_URL: ${PASSWORD_RESET_PUBLIC_URL:-https://seu-dominio.com/reset-password}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-15}
      MAIL_WORKER_INTERVAL_MS: ${MAIL_WORKER_INTERVAL_MS:-3000}
    volumes:
      - "${SICREDI_CERTS_DIRECTORY:-./.secrets/sicredi}:/run/sicredi:ro"
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-https://api-esporte.testes-techcode.shop/v1}
        EXPO_PUBLIC_CLUB: ${EXPO_PUBLIC_CLUB:-esporte}
        EXPO_PUBLIC_TENANT_SLUG: ${TENANT_SLUG:-nacional-patos}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-172.30.77.0/24}
          gateway: ${DOCKER_NETWORK_GATEWAY:-172.30.77.1}
