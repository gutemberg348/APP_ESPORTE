name: nacional
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nacional}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup para criar o .env}
      POSTGRES_DB: ${POSTGRES_DB:-nacional}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-nacional}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nacional}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      CARD_TOKEN_SECRET: ${CARD_TOKEN_SECRET:?Defina CARD_TOKEN_SECRET no .env para usar o perfil full}
      JWT_SECRET: ${JWT_SECRET:?Execute npm run setup para gerar o segredo JWT}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:?Execute npm run setup para gerar o segredo dos ingressos}
      JWT_ISSUER: nacional-api
      JWT_AUDIENCE: nacional-app
      JWT_ACCESS_TTL_SECONDS: 900
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_WEBHOOK_URL: ${ASAAS_WEBHOOK_URL:-}
      ASAAS_WEBHOOK_EMAIL: ${ASAAS_WEBHOOK_EMAIL:-}
      ASAAS_DATA_SECRET: ${ASAAS_DATA_SECRET:-}
      ASAAS_MERCHANT_WALLETS: ${ASAAS_MERCHANT_WALLETS:-}
      TENANT_SLUG: ${TENANT_SLUG:-nacional-patos}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
