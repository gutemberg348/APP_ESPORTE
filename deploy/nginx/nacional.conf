# Included from the Ubuntu Nginx http context via sites-enabled.
# HTTP bootstrap: Certbot configures HTTPS for these two server names.
# Keep the client certificate used for Sicredi out of this public TLS setup.
map $uri $nacional_api_log_path {
    ~^/v1/payments/webhooks/sicredi/ /v1/payments/webhooks/sicredi/[redacted];
    default $uri;
}

log_format nacional_api '$remote_addr [$time_local] '
    '"$request_method $nacional_api_log_path $server_protocol" '
    '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name api-esporte.testes-techcode.shop;

    access_log /var/log/nginx/nacional-api.access.log nacional_api;
    error_log /var/log/nginx/nacional-api.error.log;
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Replace caller-supplied IP headers; the API trusts this loopback proxy only.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_next_upstream off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name esporte.testes-techcode.shop;

    access_log /var/log/nginx/nacional-web.access.log;
    error_log /var/log/nginx/nacional-web.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
