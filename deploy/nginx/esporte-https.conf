# Managed by scripts/configure-esporte-nginx.py. Only Esporte domains.
map $uri $esporte_safe_path {
    ~^/v1/payments/webhooks/sicredi/ /v1/payments/webhooks/sicredi/[redacted];
    default $uri;
}
log_format esporte_api '$remote_addr [$time_local] "$request_method $esporte_safe_path $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name esporte.testes-techcode.shop api-esporte.testes-techcode.shop;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-esporte.testes-techcode.shop;
    ssl_certificate /etc/letsencrypt/live/esporte-app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esporte-app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/esporte-api.access.log esporte_api;
    error_log /var/log/nginx/esporte-api.error.log;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_next_upstream off;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name esporte.testes-techcode.shop;
    ssl_certificate /etc/letsencrypt/live/esporte-app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esporte-app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
