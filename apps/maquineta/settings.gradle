pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { url = uri('https://raw.githubusercontent.com/pagseguro/pagseguro-sdk-plugpagservicewrapper/master') } }
            filter { includeGroup 'br.com.uol.pagseguro.plugpagservice.wrapper' }
        }
    }
}
rootProject.name = 'bilheteria-moderninha'
